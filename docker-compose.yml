services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mint
      POSTGRES_PASSWORD: mint
      POSTGRES_DB: mint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
